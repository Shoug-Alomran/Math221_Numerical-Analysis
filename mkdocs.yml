site_name: Math 221 - Numerical Analysis Project
site_description: Bisection, Newton–Raphson, and Secant methods with results and applications
site_url: https://numerical-analysis.shoug-tech.com/
copyright: © 2026 Shoug Fawaz Alomran · All rights reserved
use_directory_urls: true
strict: true

hooks:
  - hooks/seo.py

theme:
  name: material
  custom_dir: overrides
  logo: img/logo-icon.png
  favicon: img/favicon.png
  font: false
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Switch to light mode

# Sections are split on " - ": the first part is the header dropdown label,
# the second is the caption shown inside the menu.
nav:
  - Home: index.md
  - Study - Background & methods:
      - Abstract: abstract.md
      - Introduction: introduction.md
      - Methods: methods.md
  - Findings - Results & discussion:
      - Results: results.md
      - Comparison of Methods: comparison.md
      - Applications: applications.md
      - Conclusion: conclusion.md
      - References: references.md
  - Report - Deliverables:
      - Report: report/index.md
      - PDF report: report/PDF-Report.pdf

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - styles/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - javascripts/site.js
  - javascripts/roots.js
  - javascripts/seo.js
