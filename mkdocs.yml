site_name: Math 221 - Numerical Analysis Project
site_description: Bisection, Newton–Raphson, and Secant methods with results and applications
site_url: https://numerical-analysis.shoug-tech.com/
copyright: © 2026 Shoug Fawaz Alomran · All rights reserved
use_directory_urls: true
strict: true

hooks:
  - hooks/seo.py

theme:
  name: material
  custom_dir: overrides
  logo: logo.png
  favicon: google.png
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/white-balance-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Abstract: abstract.md
  - Introduction: introduction.md
  - Methods: methods.md
  - Results: results.md
  - Comparison of Methods: comparison.md
  - Applications: applications.md
  - Conclusion: conclusion.md
  - References: references.md
  - Report: 
    - report/index.md
    - report/PDF-Report.pdf

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - styles/extra.css

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/cta-footer.js
  - javascripts/seo.js
